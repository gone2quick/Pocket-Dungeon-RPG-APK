name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project and copy game files
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version number and signing key
        run: |
          VC=${{ github.run_number }}
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode[ =]*[0-9]\+/versionCode $VC/; s/versionName[ =]*\"[^\"]*\"/versionName \"$VN\"/" android/app/build.gradle
          grep -q "versionCode $VC" android/app/build.gradle
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          block = """android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../keystore/pocket-dungeon.keystore')
                      storePassword 'android'
                      keyAlias 'pocketdungeon'
                      keyPassword 'android'
                  }
              }
          """
          assert 'android {\n' in s
          open(p, 'w').write(s.replace('android {\n', block, 1))
          PY

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android --splashBackgroundColor '#020617' --splashBackgroundColorDark '#020617'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-dungeon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
